# Add inside the snclock.com HTTPS server. Keep existing SN fallback location /,
# TLS, health routes and WebSocket location. Use the same release as the ToM host.
location = / {
    root /srv/snclock/releases/6a130ba/frontend/dist;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}
location /source/ {
    root /srv/snclock/releases/6a130ba/frontend/dist;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}
location /assets/ {
    root /srv/snclock/releases/6a130ba/frontend/dist;
    try_files $uri @previous_snclock_asset;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location @previous_snclock_asset {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
}
location /static/ {
    alias /var/www/tom-snclock/static/;
    expires 7d;
}
# Explicit workspace paths only: never divert the SN API wholesale to Django.
location ~ ^/(targets|observations|dataproducts|telescope-data|from-snclock|users|accounts|groups|calendar|comments|comment|system-status|stdweb|api-auth|api/(groups|targets|targetextra|targetname|targetlist|observations|dataproducts|reduceddatums|token-auth))(/|$) {
    proxy_pass http://127.0.0.1:8011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
# Match the existing ToM origin's isolation for public embedded report HTML.
location ~ ^/api/(candidates|system|plots|stats|ztf|sitian-claw|sn-clock|sky|export|v1)(/|$) {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    add_header Access-Control-Allow-Origin "*";
    add_header Content-Security-Policy "sandbox allow-scripts allow-popups allow-downloads" always;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
}
