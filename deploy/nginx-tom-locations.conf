# Include INSIDE the existing tom.snclock.com HTTPS server, before location /.
# Keep the current /static/, /reduce/, TLS and Django location / unchanged.
# Set this asset path to the SAME release as SNCLOCK_FRONTEND_DIST.
location /assets/ {
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript;
    alias /srv/snclock-tom/current/frontend/dist/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Do NOT proxy /api/ wholesale: /api/targets and other TOM APIs belong to Django.
location ~ ^/api/(candidates|system|plots|stats|ztf|sitian-claw|sn-clock|sky|export|v1)(/|$) {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The public read-only SN API does not need TOM login credentials.
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    # Sandboxed plots have an opaque origin. This applies ONLY to public,
    # credential-stripped read APIs; never apply it to Django or telescope-data.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    add_header Access-Control-Allow-Origin "*";
    # Also isolate report/plot HTML opened directly, not only iframe embeds.
    add_header Content-Security-Policy "sandbox allow-scripts allow-popups allow-downloads" always;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
}
